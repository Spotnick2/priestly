name: Release

# CurseForge derives the release type from the tag name: a tag containing
# "alpha" uploads as Alpha, "beta" as Beta, anything else as Release.
# So the beta stream is v2.0.0-beta1, v2.0.0-beta2, ...
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the packager reads the tag history for the changelog

      - name: Syntax-check the Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p PriestlyCompat.lua PriestlyConfig.lua Priestly.lua

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # Pinned to a SHA rather than the moving v2 tag: Forever support
      # (flavor "forever"/"camelot", CurseForge gameVersionTypeID 88568)
      # landed in 7391c8de on 2026-09-17 and is only days old.
      - name: Package and upload
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
