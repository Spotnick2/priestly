name: Package check

# `check` is a dry run. -d is the real no-upload switch: merely leaving
# CF_API_KEY out still lets the packager cut a GitHub release - with the WHOLE
# CHANGELOG.md as its notes. CurseForge keeps building releases with its own
# packager from the tag webhook (AGENTS.md, Packaging).
#
# On a tag, once `check` has passed, the zip it built and checked is
# published twice more (#103), never rebuilt: `release` makes the GitHub
# Release (with release.json), `wago` uploads to Wago Addons. The packager
# stays out of both.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish an existing tag again where it failed. Run it from main: `check`
  # builds the tag's tree, so a tag from before #103 has no X-Wago-ID and
  # `wago` refuses it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v2.0.16)
        required: true
      publish:
        description: Where to publish it
        type: choice
        options: [both, github, wago]
        default: both

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty except on a manual run, so checkout keeps its default: the
          # commit that triggered the run (a branch ref would build its tip).
          ref: ${{ inputs.tag }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # Both embedded libraries at the refs .pkgmeta pins - read from there BY
      # PATH, never written twice - each checked to BE that commit. CI tests
      # the libraries a release would actually ship, not whatever their main
      # holds today. A `commit:` pin works as well as a tag.
      - name: Fetch the libraries at their pinned refs
        run: |
          bash tests/fetch_external.sh Libs/LibGroupBuffs-1.0 "$RUNNER_TEMP/LibGroupBuffs"
          bash tests/fetch_external.sh Libs/LibGlass-1.0 "$RUNNER_TEMP/LibGlass"
          echo "LIBGROUPBUFFS=$RUNNER_TEMP/LibGroupBuffs" >> "$GITHUB_ENV"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"

      # Priestly's files and LibGroupBuffs'. LibGlass is checked in its own
      # repository, and every test loads it first.
      - name: Syntax-check the Lua
        run: |
          # tests/libfiles.lua is the one reader of the libraries' XML; the
          # harness, run.ps1 and deploy.ps1 use it too.
          files=$(lua5.1 tests/libfiles.lua "$LIBGROUPBUFFS" load "$LIBGLASS") || exit 1
          # The TOC is the list, so a new file cannot go unchecked here.
          toc=$(grep -E '^[^#].*[.]lua$' Priestly.toc | tr -d '\r')
          test -n "$toc" || { echo "Priestly.toc lists no Lua files"; exit 1; }
          luac5.1 -p $toc \
            $(printf '%s\n' $files | sed "s|^|$LIBGROUPBUFFS/|")

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # Local tests read the libraries from sibling checkouts, so they cannot
      # prove a package carries them. Assert the zip's SHAPE instead: an exact
      # allowlist, not a denylist. Priestly's TOC and every Lua file it loads;
      # under Libs/LibGroupBuffs-1.0 its XML, every file the XML loads and
      # LICENSE; under Libs/LibGlass-1.0 the same plus its textures - NOTHING
      # else (a library's tests or notes, or a new file, fail here instead of
      # shipping). The library lists come from tests/libfiles.lua, read from
      # the pinned checkouts.
      #
      # This is the BigWigs packager's zip. Releases are built by CurseForge's
      # own packager from the tag webhook, which CI cannot run - so the
      # published file is checked by hand after each release (AGENTS.md,
      # Releasing).
      - name: The package is exactly the addon and its two libraries
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          gb=Priestly/Libs/LibGroupBuffs-1.0
          glass=Priestly/Libs/LibGlass-1.0
          set -o pipefail
          {
            echo Priestly/Priestly.toc
            tr -d '\r' < Priestly.toc | grep -v '^#' | grep '\.lua$' | sed 's|^|Priestly/|'
            lua5.1 tests/libfiles.lua "$LIBGROUPBUFFS" ship "$LIBGLASS" | sed "s|^|$gb/|"
            echo "$gb/LICENSE"
            lua5.1 tests/libfiles.lua --glass "$LIBGLASS" ship | sed "s|^|$glass/|"
          } | sort > expected.txt
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) > actual.txt
          echo "LibGroupBuffs files expected: $(grep -c "^$gb/" expected.txt)"
          echo "LibGlass files expected: $(grep -c "^$glass/" expected.txt) ($(grep -c "^$glass/Media/" expected.txt) textures)"
          if ! diff -u expected.txt actual.txt; then
            echo "the package differs from the addon + its libraries (- missing, + extra)"
            exit 1
          fi
          # And the packaged LibGroupBuffs finds every texture it draws in the
          # packaged LibGlass, at the paths the client will load.
          lua5.1 tests/libfiles.lua "unpacked/$gb" load "unpacked/$glass" > /dev/null

      # The packager fetched its own copies of the libraries; prove it embedded
      # the pinned commits' content (the same files the tests just ran
      # against). Its text filter rewrites .lua/.xml with CRLF (release.sh:
      # line_ending defaults to "dos"), so those compare with CRs stripped;
      # everything else (textures, LICENSE) must match byte for byte.
      - name: The packaged libraries are the pinned commits
        run: |
          bad=0
          check() {
            local packaged=$1 pinned=$2
            while read -r f; do
              case "$f" in
                *.lua|*.xml) cmp -s <(tr -d '\r' < "$packaged/$f") <(tr -d '\r' < "$pinned/$f") ;;
                *) cmp -s "$packaged/$f" "$pinned/$f" ;;
              esac || { echo "differs from the pinned checkout: $packaged/$f"; bad=1; }
            done < <(cd "$packaged" && find . -type f | sed 's|^\./||')
          }
          check unpacked/Priestly/Libs/LibGroupBuffs-1.0 "$LIBGROUPBUFFS"
          check unpacked/Priestly/Libs/LibGlass-1.0 "$LIBGLASS"
          test "$bad" -eq 0

      # What a tag would publish next to the zip, built on every run so a
      # changelog heading or TOC field that breaks it fails on the pull request.
      # Off a tag there is no tag section, so it reads the newest one.
      - name: The release notes and release.json build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          bash tests/release_files.sh "$tag" "$zip" "$RUNNER_TEMP/release-files"

      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default - without include-hidden-files the upload finds
      # nothing. `warn` then leaves the job green while publishing no artifact,
      # so a passing check would not actually prove the package built.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: priestly-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

  # A GitHub Release for every tag (#91): the zip `check` built and checked,
  # release.json, and the tag's CHANGELOG.md section as the notes. The only job
  # allowed to write to the repository.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'wago')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            tests/release_files.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: priestly-package
          path: dist

      - name: The zip is the tag's
        run: |
          ls dist
          zip="dist/Priestly-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: The release notes and release.json
        run: bash tests/release_files.sh "$TAG" "$ZIP" out

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${TAG,,}" in *alpha*|*beta*) pre=--prerelease ;; esac
          gh release create "$TAG" "$ZIP" out/release.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Priestly ${TAG#v}" --notes-file out/notes.md $pre

  # The same zip on Wago Addons, through its upload API - the request the
  # packager's upload_wago makes, minus its two problems: it would package a
  # second, unchecked zip, and send the whole CHANGELOG.md as the changelog.
  # Only this job sees WAGO_API_TOKEN.
  wago:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            tests/release_files.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: priestly-package
          path: dist

      - name: The zip is the tag's
        run: |
          zip="dist/Priestly-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: The release notes and release.json
        run: bash tests/release_files.sh "$TAG" "$ZIP" out

      # The project is the packaged TOC's X-Wago-ID. Each interface becomes the
      # patch Wago names it by (16001 -> 1.60.1), which must be one Wago lists
      # for Forever: the packager would fall back to a neighbouring patch, but a
      # new client build Wago doesn't know yet should stop here instead. Run the
      # tag again (workflow_dispatch, wago) once Wago lists it.
      - name: The Wago upload metadata
        run: |
          id=$(unzip -p "$ZIP" Priestly/Priestly.toc | tr -d '\r' | sed -n 's/^## X-Wago-ID: *//p' | head -1)
          test -n "$id" || { echo "the packaged TOC has no X-Wago-ID"; exit 1; }
          echo "WAGO_ID=$id" >> "$GITHUB_ENV"
          known=$(curl -sS --fail --retry 3 https://addons.wago.io/api/data/game | jq -c '.patches.forever // []')
          echo "Wago's Forever patches: $known"
          patches=()
          for i in $(jq -r '.releases[0].metadata[].interface' out/release.json); do
            p=$(printf '%d.%d.%d' $((i / 10000)) $((i / 100 % 100)) $((i % 100)))
            jq -e --arg p "$p" 'index($p) != null' <<< "$known" > /dev/null ||
              { echo "Wago lists no Forever patch $p (interface $i)"; exit 1; }
            patches+=("$p")
          done
          case "${TAG,,}" in *alpha*) stability=alpha ;; *beta*) stability=beta ;; *) stability=stable ;; esac
          jq -n --arg label "$TAG" --arg stability "$stability" --rawfile changelog out/notes.md \
            --argjson patches "$(printf '%s\n' "${patches[@]}" | jq -R . | jq -s .)" \
            '{label: $label, stability: $stability, changelog: $changelog,
              supported_forever_patches: $patches}' > out/metadata.json
          cat out/metadata.json

      - name: Upload to Wago Addons
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          test -n "$WAGO_API_TOKEN" || { echo "the WAGO_API_TOKEN secret is not set"; exit 1; }
          code=$(curl -sS --retry 3 --retry-delay 10 -o out/result.json -w '%{http_code}' \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H 'accept: application/json' \
            -F 'metadata=<out/metadata.json' \
            -F "file=@$ZIP" \
            "https://addons.wago.io/api/projects/$WAGO_ID/version")
          echo "HTTP $code"
          case "$code" in
            200|201) echo "uploaded: https://addons.wago.io/addons/$WAGO_ID" ;;
            *) cat out/result.json 2>/dev/null; exit 1 ;;
          esac
